<!DOCTYPE html>
<html>
<head>
    <title>My Profile - Call Assistant</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .profile-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .profile-container h2 {
            color: #ff6b00;
            margin-bottom: 25px;
        }

        .profile-info {
            font-size: 18px;
            line-height: 2;
        }

        .profile-info strong {
            color: #333;
        }

        .profile-buttons {
            margin-top: 25px;
        }

        .profile-buttons button {
            background: #ff6b00;
            color: white;
            border: none;
            padding: 12px 18px;
            margin-right: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .profile-buttons button:hover {
            background: #e85d00;
        }
    </style>
</head>

<body>

    <div class="profile-container">

        <h2>My Profile 👤</h2>

        <div class="profile-info">

            <p>
                <strong>Name:</strong>
                <span id="profileName">Loading...</span>
            </p>

            <p>
                <strong>Email:</strong>
                <span id="profileEmail">Loading...</span>
            </p>

            <p>
                <strong>Phone:</strong>
                <span id="profilePhone">Loading...</span>
            </p>

        </div>

        <div class="profile-buttons">

            <button onclick="goToDashboard()">
                My Bookings
            </button>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </div>


    <script>

        const token = localStorage.getItem("userToken");

        // Check whether user is logged in
        if (!token) {

            window.location.href = "user-login.html";

        }


        function loadProfile() {

            try {

                // Read information from JWT token
                const payload = JSON.parse(
                    atob(token.split(".")[1])
                );


                // Display name
                document.getElementById("profileName").innerText =
                    payload.name || "Not available";


                // Display email
                document.getElementById("profileEmail").innerText =
                    payload.email || "Not available";


                // Display phone
                document.getElementById("profilePhone").innerText =
                    payload.phone || "Not available";


            } catch (error) {

                console.error(error);

                document.getElementById("profileName").innerText =
                    "Not available";

                document.getElementById("profileEmail").innerText =
                    "Not available";

                document.getElementById("profilePhone").innerText =
                    "Not available";

            }

        }


        function goToDashboard() {

            window.location.href = "user-dashboard.html";

        }


        function logout() {

            localStorage.removeItem("userToken");
            localStorage.removeItem("userName");
            localStorage.removeItem("userEmail");

            window.location.href = "user-login.html";

        }


        // Load profile information
        loadProfile();

    </script>

</body>
</html>
