<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Login - Call Assistant</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #fff3e8, #ffe0c2);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 15px;

            border-radius: 50%;

            overflow: hidden;

            border: 4px solid #ff6b00;
        }

        .logo img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        h1 {
            margin: 10px 0 5px;

            color: #ff6b00;

            font-size: 28px;
        }

        .subtitle {
            color: #777;

            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;

            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #ff6b00;

            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.12);
        }

        button {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 9px;

            background: #ff6b00;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #e85d00;
        }

        #message {
            margin-top: 18px;

            font-weight: bold;

            min-height: 20px;
        }

        .register-link {
            margin-top: 22px;

            color: #666;
        }

        .register-link a {
            color: #ff6b00;

            font-weight: bold;

            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: inline-block;

            margin-top: 15px;

            color: #555;

            text-decoration: none;

            font-size: 14px;
        }

        .home-link:hover {
            color: #ff6b00;
        }

        @media (max-width: 500px) {

            .login-container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }

        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">
            <img src="logo.png.jpeg" alt="Call Assistant">
        </div>
