<!DOCTYPE html>
<html>
<head>
    <title>User Login - Call Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            color: #0066cc;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0066cc;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #004c99;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>🔐 User Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p id="message"></p>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Register</a>
        </div>

    </div>

    <script>

        document.getElementById("loginForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {

                const response = await fetch(
                    "https://call-assistant-backend.onrender.com/user-login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (data.success) {

                    localStorage.setItem("userToken", data.token);
                    localStorage.setItem("userName", data.name);
                    localStorage.setItem("userEmail", data.email);
                    
                    window.location.href = "user-dashboard.html";

                } else {

                    document.getElementById("message").innerText =
                        data.message;

                }

            } catch (error) {

                console.error(error);

                document.getElementById("message").innerText =
                    "Login failed. Please try again.";

            }

        });

    </script>

</body>
</html>
