<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Call Assistant - Register</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #fff7ef,
                #ffd6b3,
                #fffaf5
            );

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 430px;

            background: white;
            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;

            object-fit: contain;

            margin-bottom: 10px;
        }

        h2 {
            color: #ff6b00;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;

            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #ff6b00;
        }

        button {
            width: 100%;

            padding: 14px;

            margin-top: 10px;

            border: none;
            border-radius: 10px;

            background: #ff6b00;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #e85d00;
        }

        #message {
            margin-top: 18px;

            font-weight: bold;
        }

        .login-link {
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: #ff6b00;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 480px) {

            .register-container {
                padding: 25px 20px;
            }

            .logo {
                width: 75px;
                height: 75px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <!-- Logo -->
        <img
            src="logo.png.jpeg"
            alt="Call Assistant Logo"
            class="logo"
        >

        <h2>Create Account</h2>

        <p class="subtitle">
            Register to use Call Assistant services
        </p>

        <form id="registerForm">

            <!-- Full Name -->
            <div class="input-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <!-- Email -->
            <div class="input-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <!-- Phone -->
            <div class="input-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <!-- Date of Birth -->
            <div class="input-group">
                <label for="date_of_birth">Date of Birth</label>

                <input
                    type="date"
                    id="date_of_birth"
                    required
                >
            </div>

            <!-- Password -->
            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <!-- Register Button -->
            <button type="submit">
                Create Account
            </button>

        </form>

        <p id="message"></p>

        <div class="login-link">
            Already have an account?
            <a href="user-login.html">Login</a>
        </div>

    </div>


    <script>

        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");


        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const phone =
                    document.getElementById("phone").value.trim();

                const date_of_birth =
                    document.getElementById("date_of_birth").value;
                                
                const password =
                    document.getElementById("password").value;
           
               const birthDate = new Date(date_of_birth);
const today = new Date();

let age = today.getFullYear() - birthDate.getFullYear();

const monthDifference =
    today.getMonth() - birthDate.getMonth();

if (
    monthDifference < 0 ||
    (monthDifference === 0 &&
        today.getDate() < birthDate.getDate())
) {
    age--;
}

if (age < 18) {
    message.textContent =
        "You must be 18 years or older to create an account.";

    message.style.color = "red";

    return;
}


                message.textContent = "Creating account...";
                message.style.color = "#ff6b00";


                try {

                    const response = await fetch(
                        "https://call-assistant-backend.onrender.com/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                name: name,

                                email: email,

                                password: password,

                                phone: phone,

                                date_of_birth: date_of_birth

                            })
                        }
                    );


                    const data = await response.json();


                    if (data.success) {

                        message.textContent =
                            "Registration successful!";

                        message.style.color = "green";

                        registerForm.reset();

                    } else {

                        message.textContent =
                            data.message || "Registration failed.";

                        message.style.color = "red";

                    }

                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to server.";

                    message.style.color = "red";

                }

            }
        );

    </script>

</body>
</html>
