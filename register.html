<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Call Assistant</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(135deg, #fff3e8, #ffe0c2);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 15px;

            border-radius: 50%;

            overflow: hidden;

            border: 4px solid #ff6b00;
        }

        .logo img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        h1 {
            margin: 10px 0 5px;

            color: #ff6b00;

            font-size: 28px;
        }

        .subtitle {
            color: #777;

            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;

            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        input:focus {
            border-color: #ff6b00;

            box-shadow:
                0 0 0 3px rgba(255, 107, 0, 0.12);
        }

        button {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 9px;

            background: #ff6b00;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: #e85d00;

            transform: translateY(-1px);
        }

        #message {
            margin-top: 18px;

            font-weight: bold;

            min-height: 20px;
        }

        .login-link {
            margin-top: 22px;

            color: #666;
        }

        .login-link a {
            color: #ff6b00;

            font-weight: bold;

            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: inline-block;

            margin-top: 15px;

            color: #555;

            text-decoration: none;

            font-size: 14px;
        }

        .home-link:hover {
            color: #ff6b00;
        }

        @media (max-width: 500px) {

            .register-container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }

        }

    </style>

</head>

<body>

    <div class="register-container">

        <div class="logo">
            <img src="logo.png.jpeg" alt="Call Assistant">
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Join Call Assistant today
        </p>

        <form id="registerForm">

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>
<div class="form-group">

    <label>Date of Birth</label>

    <input
        type="date"
        id="date_of_birth"
        required
    >

</div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button type="submit">
                Create Account →
            </button>

        </form>


        <p id="message"></p>


        <div class="login-link">

            Already have an account?

            <a href="user-login.html">
                Login
            </a>

        </div>


        <a href="index.html" class="home-link">
            ← Back to Home
        </a>

    </div>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                const name =
                    document.getElementById("name").value;

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const phone =
                    document.getElementById("phone").value;


                const message =
                    document.getElementById("message");


                message.innerText =
                    "Creating your account...";

                message.style.color =
                    "#ff6b00";


                try {

                    const response = await fetch(
                        "https://call-assistant-backend.onrender.com/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                name: name,
                                email: email,
                                password: password,
                                phone: phone
                            })
                        }
                    );


                    const data =
                        await response.json();


                    if (data.success) {

                        message.innerText =
                            "✅ Registration successful!";

                        message.style.color =
                            "#28a745";

                        document
                            .getElementById("registerForm")
                            .reset();

                    } else {

                        message.innerText =
                            data.message ||
                            "Registration failed.";

                        message.style.color =
                            "#dc3545";

                    }


                } catch (error) {

                    console.error(error);

                    message.innerText =
                        "❌ Unable to connect to server.";

                    message.style.color =
                        "#dc3545";

                }

            });

    </script>

</body>

</html>
